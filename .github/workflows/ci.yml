name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Run tests
        run: pytest devtools/tests/ -v --ignore=devtools/tests/test_gui.py --ignore=devtools/tests/test_services.py
